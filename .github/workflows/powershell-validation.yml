name: PowerShell validation

on:
  push:
    branches:
      - ci/powershell-7.6.6-validation
  pull_request:
    branches:
      - main
    paths:
      - "**.ps1"
      - "**.psm1"
      - "tests/fixtures/methodology/intensity-horizons/**"
      - ".github/workflows/powershell-validation.yml"
  workflow_dispatch:
    inputs:
      target_ref:
        description: Branch or commit to validate
        required: true
        default: main
        type: string

permissions:
  contents: read

concurrency:
  group: powershell-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: PowerShell 7.6.6 / Windows
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout workflow revision
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Select source revision
        uses: actions/checkout@v5
        with:
          repository: ${{ github.repository }}
          ref: ${{ (github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'ci/powershell-7.6.6-validation')) && 'fix/issue-41-fixture-validator-v1-2' || (github.event_name == 'workflow_dispatch' && inputs.target_ref || github.event.pull_request.head.sha) }}
          path: source
          persist-credentials: false

      - name: Install exact PowerShell 7.6.6 runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '7.6.6'
          $archive = Join-Path $env:RUNNER_TEMP "PowerShell-$version-win-x64.zip"
          $installDirectory = Join-Path $env:RUNNER_TEMP "PowerShell-$version"
          $uri = "https://github.com/PowerShell/PowerShell/releases/download/v$version/PowerShell-$version-win-x64.zip"

          Invoke-WebRequest -Uri $uri -OutFile $archive
          New-Item -ItemType Directory -Path $installDirectory -Force | Out-Null
          Expand-Archive -LiteralPath $archive -DestinationPath $installDirectory -Force

          $pwsh = Join-Path $installDirectory 'pwsh.exe'
          if (-not (Test-Path -LiteralPath $pwsh)) {
            throw "PowerShell $version executable was not found after extraction."
          }

          $actualVersion = & $pwsh -NoLogo -NoProfile -Command '$PSVersionTable.PSVersion.ToString()'
          if ($LASTEXITCODE -ne 0 -or $actualVersion.Trim() -ne $version) {
            throw "Expected PowerShell $version; detected '$actualVersion'."
          }

          "SINAYXA_PWSH_PATH=$pwsh" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Verified PowerShell $actualVersion"

      - name: Install pinned PSScriptAnalyzer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $command = @'
          $ErrorActionPreference = 'Stop'
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module -Name PSScriptAnalyzer -RequiredVersion 1.24.0 -Scope CurrentUser -Force
          Import-Module PSScriptAnalyzer -RequiredVersion 1.24.0
          (Get-Module PSScriptAnalyzer).Version.ToString()
          '@
          & $env:SINAYXA_PWSH_PATH -NoLogo -NoProfile -Command $command
          if ($LASTEXITCODE -ne 0) {
            throw 'PSScriptAnalyzer installation failed.'
          }

      - name: Parse every PowerShell source file
        shell: pwsh
        working-directory: source
        run: |
          $ErrorActionPreference = 'Stop'
          $command = @'
          $ErrorActionPreference = 'Stop'
          $files = @(Get-ChildItem -LiteralPath . -Recurse -File -Include '*.ps1','*.psm1' | Where-Object { $_.FullName -notmatch '[\\/](\.git|\.venv|node_modules)[\\/]' })
          if ($files.Count -eq 0) {
            throw 'No PowerShell source files were found.'
          }
          $parseErrors = @()
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) {
              $parseErrors += $errors | ForEach-Object { "$($file.FullName): $($_.Message) (line $($_.Extent.StartLineNumber))" }
            }
          }
          Write-Information "PowerShell files parsed: $($files.Count)" -InformationAction Continue
          if ($parseErrors.Count -gt 0) {
            $parseErrors | ForEach-Object { Write-Error $_ }
            exit 1
          }
          '@
          & $env:SINAYXA_PWSH_PATH -NoLogo -NoProfile -Command $command
          if ($LASTEXITCODE -ne 0) {
            throw 'PowerShell parser found syntax errors.'
          }

      - name: Run PSScriptAnalyzer
        shell: pwsh
        working-directory: source
        run: |
          $ErrorActionPreference = 'Stop'
          $command = @'
          $ErrorActionPreference = 'Stop'
          Import-Module PSScriptAnalyzer -RequiredVersion 1.24.0
          $results = @(Invoke-ScriptAnalyzer -Path '.' -Recurse)
          foreach ($finding in $results) {
            Write-Information ("{0} {1} {2}:{3} {4}" -f $finding.Severity, $finding.RuleName, $finding.ScriptName, $finding.Line, $finding.Message) -InformationAction Continue
          }
          $errors = @($results | Where-Object { $_.Severity -eq 'Error' })
          $nonErrors = @($results | Where-Object { $_.Severity -ne 'Error' })
          Write-Information "PSScriptAnalyzer errors: $($errors.Count)" -InformationAction Continue
          Write-Information "PSScriptAnalyzer non-error findings: $($nonErrors.Count)" -InformationAction Continue
          if ($errors.Count -gt 0) {
            exit 1
          }
          '@
          & $env:SINAYXA_PWSH_PATH -NoLogo -NoProfile -Command $command
          if ($LASTEXITCODE -ne 0) {
            throw 'PSScriptAnalyzer reported blocking errors.'
          }

      - name: Validate the v1.2.0 synthetic fixture
        shell: pwsh
        working-directory: source
        run: |
          $ErrorActionPreference = 'Stop'
          & $env:SINAYXA_PWSH_PATH -NoLogo -NoProfile -File 'scripts/validation/validate_intensity_horizon_fixture.ps1'
          if ($LASTEXITCODE -ne 0) {
            throw 'The v1.2.0 fixture validator failed.'
          }

      - name: Run positive and negative validator tests
        shell: pwsh
        working-directory: source
        run: |
          $ErrorActionPreference = 'Stop'
          & $env:SINAYXA_PWSH_PATH -NoLogo -NoProfile -File 'scripts/validation/test_intensity_horizon_fixture_validator.ps1'
          if ($LASTEXITCODE -ne 0) {
            throw 'The validator test harness failed.'
          }

      - name: Record validated source revision
        shell: pwsh
        working-directory: source
        run: |
          $ErrorActionPreference = 'Stop'
          git rev-parse HEAD
          Get-FileHash -LiteralPath 'tests/fixtures/methodology/intensity-horizons/t01-t19-synthetic-evidence-v1.2.0.json' -Algorithm SHA256
