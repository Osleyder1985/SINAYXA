name: PowerShell quality gate

on:
  push:
    branches:
      - main
      - quality/powershell-analyzer-hardening
  pull_request:
    branches:
      - main
      - test/issue-121-migration-manifest-integrity
    paths:
      - "**.ps1"
      - "**.psm1"
      - "**.md"
      - "tests/fixtures/methodology/intensity-horizons/**"
      - "tests/fixtures/methodology/evidence-standard/**"
      - "scripts/validation/validate_evidence_standard_fixture.ps1"
      - "scripts/validation/test_evidence_standard_fixture.ps1"
      - "docs/news-and-events/intensity-and-time-horizons-test-record.md"
      - "docs/news-and-events/intensity-and-time-horizons-proposal.md"
      - "docs/news-and-events/intensity-horizons-empirical-validation-protocol.md"
      - "docs/news-and-events/evidence-standard-for-indicia-rumours-and-leaks.md"
      - "docs/news-and-events/source-credibility-and-independence-proposal.md"
      - "docs/news-and-events/source-evidence-provenance-contract-proposal.md"
      - "docs/news-and-events/source-monitoring-latency-and-limits-proposal.md"
      - "docs/news-and-events/alert-severity-and-deduplication-proposal.md"
      - "tests/fixtures/methodology/alerts/**"
      - "tests/fixtures/methodology/source-independence/**"
      - "schemas/source-evidence-contract-0.2.0.schema.json"
      - "tests/fixtures/contracts/source-evidence-contract-v0.2.0.json"
      - "scripts/validation/validate_source_evidence_contract_schema.py"
      - "scripts/validation/contract_0_2_1_extensions.py"
      - "scripts/validation/migrate_source_evidence_contract_0_2_0_to_0_2_1.py"
      - "scripts/validation/test_contract_0_2_1_extensions.py"
      - "schemas/source-evidence-contract-0.2.1.schema.json"
      - "tests/fixtures/contracts/source-evidence-contract-v0.2.1.json"
      - "scripts/validation/validate_source_evidence_contract_0_2_1.py"
      - "docs/news-and-events/source-evidence-contract-0.2.1-addendum.md"
      - "docs/news-and-events/contract-0.2.1-verification-matrix.md"
      - "requirements-contract-validation.txt"
      - "scripts/validation/test_source_evidence_contract.ps1"
      - "database/migrations/**"
      - "scripts/news_and_events/**"
      - "tests/news_and_events/**"
      - "docs/news-and-events/event-registry.md"
      - "scripts/validation/validate_source_independence_fixture.ps1"
      - "scripts/validation/test_source_independence_fixture.ps1"
      - "scripts/validation/validate_alert_fixture.ps1"
      - "scripts/validation/test_alert_fixture.ps1"
      - ".github/workflows/powershell-validation.yml"
      - ".github/workflows/security-quality.yml"
      - "package.json"
      - "package-lock.json"
      - ".markdownlint.jsonc"
      - ".markdownlint-cli2.jsonc"
      - "scripts/validation/lint-markdown.mjs"
      - "schemas/temporal-event-contract-1.0.0.schema.json"
      - "tests/fixtures/contracts/temporal-event-contract-v1.0.0.json"
      - "scripts/validation/validate_temporal_event_contract.py"
      - "scripts/validation/test_temporal_event_contract.py"
      - "requirements-temporal-contract-validation.txt"
      - "database/migrations/**"
      - "scripts/news_and_events/**"
      - "tests/news_and_events/**"
      - "docs/news-and-events/event-registry.md"
  workflow_dispatch:
    inputs:
      target_ref:
        description: Branch, tag, or commit to validate
        required: true
        default: main
        type: string

permissions:
  contents: read

concurrency:
  group: powershell-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: PowerShell 7.7.0 / Windows
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout workflow revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout exact source revision
        id: source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || (github.event_name == 'workflow_dispatch' && inputs.target_ref || github.sha) }}
          path: source
          persist-credentials: false

      - name: Install and verify exact PowerShell 7.7.0
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '7.7.0'
          $expectedSha256 = '7c74e03b20a75b59715847439d046a6214b1863ee79b187872980f139bb4a05f'
          $archive = Join-Path $env:RUNNER_TEMP "PowerShell-$version-win-x64.zip"
          $installDirectory = Join-Path $env:RUNNER_TEMP "PowerShell-$version"
          $uri = "https://github.com/PowerShell/PowerShell/releases/download/v$version/PowerShell-$version-win-x64.zip"

          # GitHub release downloads can transiently return gateway/error pages.
          # Retry transport failures, then verify the exact official release digest.
          $downloaded = $false
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            try {
              Remove-Item -LiteralPath $archive -Force -ErrorAction SilentlyContinue
              Invoke-WebRequest -Uri $uri -OutFile $archive -TimeoutSec 120
              if (-not (Test-Path -LiteralPath $archive) -or (Get-Item -LiteralPath $archive).Length -lt 1MB) {
                throw 'PowerShell release archive is missing or unexpectedly small.'
              }
              $actualSha256 = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
              if ($actualSha256 -ne $expectedSha256) {
                throw "PowerShell release archive SHA-256 mismatch: $actualSha256"
              }
              $downloaded = $true
              break
            }
            catch {
              if ($attempt -eq 3) { throw }
              Write-Warning "PowerShell release download attempt $attempt failed: $($_.Exception.Message)"
              Start-Sleep -Seconds (5 * $attempt)
            }
          }
          if (-not $downloaded) { throw 'PowerShell release archive could not be downloaded and verified.' }

          New-Item -ItemType Directory -Path $installDirectory -Force | Out-Null
          Expand-Archive -LiteralPath $archive -DestinationPath $installDirectory -Force
          $pwsh = Join-Path $installDirectory 'pwsh.exe'
          if (-not (Test-Path -LiteralPath $pwsh)) { throw "PowerShell $version executable was not found." }
          $actual = & $pwsh -NoLogo -NoProfile -Command '$PSVersionTable.PSVersion.ToString()'
          if ($LASTEXITCODE -ne 0 -or $actual.Trim() -ne $version) { throw "Expected PowerShell $version; detected '$actual'." }
          "SINAYXA_PWSH_PATH=$pwsh" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "Verified PowerShell $actual (SHA-256: $actualSha256)"

      - name: Install pinned PSScriptAnalyzer 1.24.0
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $command = @'
          $ErrorActionPreference = 'Stop'
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module -Name PSScriptAnalyzer -RequiredVersion 1.24.0 -Scope CurrentUser -Force
          Import-Module PSScriptAnalyzer -RequiredVersion 1.24.0
          (Get-Module PSScriptAnalyzer).Version.ToString()
          '@
          & $env:SINAYXA_PWSH_PATH -NoLogo -NoProfile -Command $command
          if ($LASTEXITCODE -ne 0) { throw 'PSScriptAnalyzer installation failed.' }

      - name: Inventory and parse every tracked PowerShell source file
        shell: pwsh
        working-directory: source
        run: |
          $ErrorActionPreference = 'Stop'
          $files = @(git ls-files '*.ps1' '*.psm1' | Where-Object { -not [string]::IsNullOrWhiteSpace($_) })
          if ($LASTEXITCODE -ne 0) { throw 'Could not inventory tracked PowerShell files.' }
          if ($files.Count -eq 0) { throw 'No tracked PowerShell source files were found.' }
          New-Item -ItemType Directory -Path "$env:RUNNER_TEMP\sinayxa-evidence" -Force | Out-Null
          $files | Set-Content -LiteralPath "$env:RUNNER_TEMP\sinayxa-evidence\powershell-inventory.txt" -Encoding utf8
          $parseErrors = @()
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Join-Path (Get-Location) $file), [ref]$tokens, [ref]$errors)
            foreach ($errorItem in $errors) { $parseErrors += "${file}:$($errorItem.Extent.StartLineNumber): $($errorItem.Message)" }
          }
          "Tracked PowerShell files: $($files.Count)"
          if ($parseErrors.Count -gt 0) { $parseErrors | ForEach-Object { Write-Error $_ }; exit 1 }
          "Parser errors: 0"

      - name: Run PSScriptAnalyzer and enforce zero findings
        shell: pwsh
        working-directory: source
        run: |
          $ErrorActionPreference = 'Stop'
          Import-Module PSScriptAnalyzer -RequiredVersion 1.24.0
          $files = @(git ls-files '*.ps1' '*.psm1' | Where-Object { -not [string]::IsNullOrWhiteSpace($_) })
          $findings = @()
          foreach ($file in $files) { $findings += @(Invoke-ScriptAnalyzer -Path $file) }
          $findings | ConvertTo-Json -Depth 8 | Set-Content -LiteralPath "$env:RUNNER_TEMP\sinayxa-evidence\psscriptanalyzer-findings.json" -Encoding utf8
          if ($findings.Count -gt 0) {
            $findings | Format-List RuleName,Severity,ScriptName,Line,Message | Out-String | Write-Error
            throw "PSScriptAnalyzer reported $($findings.Count) finding(s); all findings require correction or documented, narrowly scoped justification."
          }
          "PSScriptAnalyzer findings: 0"

      - name: Verify PSScriptAnalyzer security-rule detection
        shell: pwsh
        working-directory: source
        run: |
          $ErrorActionPreference = 'Stop'
          & $env:SINAYXA_PWSH_PATH -NoLogo -NoProfile -File 'scripts/validation/test_powershell_security_rules.ps1'
          if ($LASTEXITCODE -ne 0) { throw 'PSScriptAnalyzer security-rule regression tests failed.' }

      - name: Validate the v1.3.0 synthetic fixture
        shell: pwsh
        working-directory: source
        run: |
          $ErrorActionPreference = 'Stop'
          & $env:SINAYXA_PWSH_PATH -NoLogo -NoProfile -File 'scripts/validation/validate_intensity_horizon_fixture.ps1'
          if ($LASTEXITCODE -ne 0) { throw 'The v1.3.0 fixture validator failed.' }

      - name: Run positive, negative, and robustness tests
        shell: pwsh
        working-directory: source
        run: |
          $ErrorActionPreference = 'Stop'
          & $env:SINAYXA_PWSH_PATH -NoLogo -NoProfile -File 'scripts/validation/test_intensity_horizon_fixture_validator.ps1'
          if ($LASTEXITCODE -ne 0) { throw 'The validator test harness failed.' }

      - name: Validate Issue #15 evidence-standard fixture v1.2.2
        shell: pwsh
        working-directory: source
        run: |
          $ErrorActionPreference = 'Stop'
          & $env:SINAYXA_PWSH_PATH -NoLogo -NoProfile -File 'scripts/validation/validate_evidence_standard_fixture.ps1'
          if ($LASTEXITCODE -ne 0) { throw 'The evidence-standard fixture validator failed.' }

      - name: Run Issue #15 positive and negative mutation tests
        shell: pwsh
        working-directory: source
        run: |
          $ErrorActionPreference = 'Stop'
          & $env:SINAYXA_PWSH_PATH -NoLogo -NoProfile -File 'scripts/validation/test_evidence_standard_fixture.ps1'
          if ($LASTEXITCODE -ne 0) { throw 'The evidence-standard mutation tests failed.' }

      - name: Validate Issue #16 S01-S16 source-independence fixture
        shell: pwsh
        working-directory: source
        run: |
          $ErrorActionPreference = 'Stop'
          & $env:SINAYXA_PWSH_PATH -NoLogo -NoProfile -File 'scripts/validation/validate_source_independence_fixture.ps1'
          if ($LASTEXITCODE -ne 0) { throw 'The Issue #16 source-independence fixture validator failed.' }

      - name: Run Issue #16 positive and negative mutation tests
        shell: pwsh
        working-directory: source
        run: |
          $ErrorActionPreference = 'Stop'
          & $env:SINAYXA_PWSH_PATH -NoLogo -NoProfile -File 'scripts/validation/test_source_independence_fixture.ps1'
          if ($LASTEXITCODE -ne 0) { throw 'The Issue #16 source-independence mutation tests failed.' }

      - name: Validate Issue #78 JSON Schema and synthetic fixture semantics
        shell: pwsh
        working-directory: source
        run: |
          $ErrorActionPreference = 'Stop'
          & $env:SINAYXA_PWSH_PATH -NoLogo -NoProfile -File 'scripts/validation/validate_source_evidence_contract.ps1'
          if ($LASTEXITCODE -ne 0) { throw 'The Issue #78 source-evidence contract validator failed.' }

      - name: Run Issue #78 contract negative mutation tests
        shell: pwsh
        working-directory: source
        run: |
          $ErrorActionPreference = 'Stop'
          & $env:SINAYXA_PWSH_PATH -NoLogo -NoProfile -File 'scripts/validation/test_source_evidence_contract.ps1'
          if ($LASTEXITCODE -ne 0) { throw 'The Issue #78 contract mutation tests failed.' }

      - name: Validate Issue #17 A01-A15 synthetic alert fixture
        shell: pwsh
        working-directory: source
        run: |
          $ErrorActionPreference = 'Stop'
          & $env:SINAYXA_PWSH_PATH -NoLogo -NoProfile -File 'scripts/validation/validate_alert_fixture.ps1'
          if ($LASTEXITCODE -ne 0) { throw 'The Issue #17 alert fixture validator failed.' }

      - name: Run Issue #17 positive, negative, and robustness tests
        shell: pwsh
        working-directory: source
        run: |
          $ErrorActionPreference = 'Stop'
          & $env:SINAYXA_PWSH_PATH -NoLogo -NoProfile -File 'scripts/validation/test_alert_fixture.ps1'
          if ($LASTEXITCODE -ne 0) { throw 'The Issue #17 alert fixture test harness failed.' }

      - name: Set up Python 3.12 for Issue #2 temporal contract
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: source/requirements-temporal-contract-validation.txt

      - name: Install pinned Issue #2 temporal contract dependencies
        shell: pwsh
        working-directory: source
        run: |
          $ErrorActionPreference = 'Stop'
          python -m pip install --requirement requirements-temporal-contract-validation.txt
          if ($LASTEXITCODE -ne 0) { throw 'Temporal contract dependency installation failed.' }

      - name: Validate Issue #2 temporal contract schema and fixture
        shell: pwsh
        working-directory: source
        run: |
          $ErrorActionPreference = 'Stop'
          python scripts/validation/validate_temporal_event_contract.py
          if ($LASTEXITCODE -ne 0) { throw 'Issue #2 temporal contract validation failed.' }

      - name: Run Issue #2 temporal contract positive and negative tests
        shell: pwsh
        working-directory: source
        run: |
          $ErrorActionPreference = 'Stop'
          python -m unittest scripts.validation.test_temporal_event_contract -v
          if ($LASTEXITCODE -ne 0) { throw 'Issue #2 temporal contract tests failed.' }

      - name: Install pinned Issue #78 contract-validation dependencies
        shell: pwsh
        working-directory: source
        run: |
          $ErrorActionPreference = 'Stop'
          python -m pip install --disable-pip-version-check --no-input -r requirements-contract-validation.txt
          if ($LASTEXITCODE -ne 0) { throw 'Issue #78 contract-validation dependencies installation failed.' }

      - name: Validate Issue #78 JSON Schema and #15/#16 compatibility
        shell: pwsh
        working-directory: source
        run: |
          $ErrorActionPreference = 'Stop'
          python scripts/validation/validate_source_evidence_contract_schema.py
          if ($LASTEXITCODE -ne 0) { throw 'Issue #78 JSON Schema or #15/#16 compatibility validation failed.' }

      - name: Run Issue #78 contract 0.2.1 corrective semantic tests
        shell: pwsh
        working-directory: source
        run: |
          $ErrorActionPreference = 'Stop'
          python -m unittest discover -s scripts/validation -p 'test_contract_0_2_1_extensions.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Issue #78 contract 0.2.1 corrective semantic tests failed.' }

      - name: Validate Issue #78 contract 0.2.1 schema and semantic fixture
        shell: pwsh
        working-directory: source
        run: |
          $ErrorActionPreference = 'Stop'
          python scripts/validation/validate_source_evidence_contract_0_2_1.py
          if ($LASTEXITCODE -ne 0) { throw 'Issue #78 contract 0.2.1 schema or semantic fixture validation failed.' }

      - name: Run Issue #93 isolated synthetic validation lab
        shell: pwsh
        working-directory: source
        run: |
          $ErrorActionPreference = 'Stop'
          & $env:SINAYXA_PWSH_PATH -NoLogo -NoProfile -File 'scripts/validation/Invoke-SyntheticValidationLab.ps1'
          if ($LASTEXITCODE -ne 0) { throw 'Issue #93 synthetic validation lab failed.' }

      - name: Record source and fixture provenance
        shell: pwsh
        working-directory: source
        run: |
          $ErrorActionPreference = 'Stop'
          $commit = (git rev-parse HEAD).Trim()
          $fixture = 'tests/fixtures/methodology/intensity-horizons/t01-t20-synthetic-evidence-v1.3.0.json'
          $hash = (Get-FileHash -LiteralPath $fixture -Algorithm SHA256).Hash
          $evidenceStandardFixture = 'tests/fixtures/methodology/evidence-standard/e01-e18-synthetic-conformance-v1.2.2.json'
          $evidenceStandardFixtureHash = (Get-FileHash -LiteralPath $evidenceStandardFixture -Algorithm SHA256).Hash
          $alertFixture = 'tests/fixtures/methodology/alerts/a01-a15-synthetic-conformance-v1.0.0.json'
          $alertFixtureHash = (Get-FileHash -LiteralPath $alertFixture -Algorithm SHA256).Hash
          $temporalFixture = 'tests/fixtures/contracts/temporal-event-contract-v1.0.0.json'
          $temporalFixtureHash = (Get-FileHash -LiteralPath $temporalFixture -Algorithm SHA256).Hash
          $temporalSchema = 'schemas/temporal-event-contract-1.0.0.schema.json'
          $temporalSchemaHash = (Get-FileHash -LiteralPath $temporalSchema -Algorithm SHA256).Hash
          $temporalValidator = 'scripts/validation/validate_temporal_event_contract.py'
          $temporalValidatorHash = (Get-FileHash -LiteralPath $temporalValidator -Algorithm SHA256).Hash
          $evidence = [ordered]@{
            source_commit = $commit
            workflow_commit = '${{ github.sha }}'
            runtime = '7.7.0'
            psscriptanalyzer = '1.24.0'
            fixture = $fixture
            fixture_sha256 = $hash
            evidence_standard_fixture = $evidenceStandardFixture
            evidence_standard_fixture_sha256 = $evidenceStandardFixtureHash
            alert_fixture = $alertFixture
            alert_fixture_sha256 = $alertFixtureHash
            temporal_fixture = $temporalFixture
            temporal_fixture_sha256 = $temporalFixtureHash
            temporal_schema = $temporalSchema
            temporal_schema_sha256 = $temporalSchemaHash
            temporal_validator = $temporalValidator
            temporal_validator_sha256 = $temporalValidatorHash
            powerShell_files = @(git ls-files '*.ps1' '*.psm1').Count
            run_id = '${{ github.run_id }}'
            event = '${{ github.event_name }}'
          }
          $evidence | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath "$env:RUNNER_TEMP\sinayxa-evidence\validation-evidence.json" -Encoding utf8
          $evidence | Format-List

      # Preserve analyzer, fixture, and provenance outputs for audit and reproducibility.
      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: powershell-validation-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}\sinayxa-evidence\
          if-no-files-found: warn
          retention-days: 90

  # Compatibility alias for the existing main ruleset's required status context.
  # The actual analyzer and fixture suite above run on PowerShell 7.7.0.
  legacy_required_status:
    name: PowerShell 7.6.6 / Windows
    needs: validate
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Mirror the PowerShell 7.7.0 quality gate result
        env:
          VALIDATION_RESULT: ${{ needs.validate.result }}
        run: |
          if [ "$VALIDATION_RESULT" != "success" ]; then
            echo "PowerShell 7.7.0 quality gate result: $VALIDATION_RESULT"
            exit 1
          fi
          echo "Legacy required status context satisfied by the successful PowerShell 7.7.0 quality gate."

