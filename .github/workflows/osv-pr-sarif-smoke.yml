name: OSV PR SARIF publication validation

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/osv-pr-sarif-smoke.yml"

permissions:
  contents: read

jobs:
  osv-pr-sarif-smoke:
    name: OSV PR reusable workflow / SARIF enabled
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@d3c1414ded37de590f207572e37a7d180f1d0ef7
    with:
      scan-args: |-
        --include-git-root
        -r
        ./
      upload-sarif: true
      fail-on-vuln: true
