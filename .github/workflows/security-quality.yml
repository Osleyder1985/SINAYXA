name: Security and dependency quality gate

on:
  pull_request:
    branches:
      - main
      - test/issue-121-migration-manifest-integrity
      - feat/issue-121-catalog-fingerprint-readonly
      - feat/issue-121-fresh-database-migration-runner
    paths:
      - "**"
      - ".github/workflows/security-quality.yml"
      - ".github/dependabot.yml"
  push:
    branches:
      - main
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  secret-scan:
    name: Secret scanning / Gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout PR head with full Git history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install verified Gitleaks 8.30.1 binary
        shell: bash
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/gitleaks_8.30.1_linux_x64.tar.gz"
          install_dir="${RUNNER_TEMP}/gitleaks-bin"
          curl --fail --location --silent --show-error \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$archive"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $archive" | sha256sum --check -
          mkdir -p "$install_dir"
          tar -xzf "$archive" -C "$install_dir" gitleaks
          echo "$install_dir" >> "$GITHUB_PATH"
          export PATH="$install_dir:$PATH"
          version_output="$(gitleaks version)"
          printf '%s\n' "$version_output"
          grep -Fq "8.30.1" <<< "$version_output"
      - name: Verify Gitleaks detects a synthetic custom-rule canary
        shell: bash
        run: |
          set -euo pipefail
          gitleaks version
          temp_repo="$(mktemp -d)"
          trap 'rm -rf "$temp_repo"' EXIT
          git -C "$temp_repo" init -q
          git -C "$temp_repo" config user.name "SINAYXA Security Test"
          git -C "$temp_repo" config user.email "security-test@example.invalid"
          cat > "$temp_repo/gitleaks.toml" <<'EOF'
          title = "SINAYXA Gitleaks regression test"
          [[rules]]
          id = "sinayxa-canary"
          description = "Synthetic canary used to prove secret detection works"
          regex = '''SINAYXA_CANARY_[A-Z0-9]{32}'''
          secretGroup = 0
          keywords = ["SINAYXA_CANARY_"]
          EOF
          printf '%s\n' 'SINAYXA_CANARY_0123456789ABCDEF0123456789ABCDEF' > "$temp_repo/canary.txt"
          git -C "$temp_repo" add canary.txt
          git -C "$temp_repo" commit -qm "test: synthetic secret canary"
          set +e
          gitleaks detect --source "$temp_repo" --config "$temp_repo/gitleaks.toml" --redact --exit-code=2 --report-format=json --report-path="$temp_repo/report.json"
          scan_status=$?
          set -e
          if [ "$scan_status" -ne 2 ]; then
            echo "::error::Gitleaks did not return the expected leak-detected exit code 2 (got $scan_status)."
            exit 1
          fi
          if ! jq -e 'length > 0 and any(.[]; .RuleID == "sinayxa-canary")' "$temp_repo/report.json" >/dev/null; then
            echo "::error::Gitleaks did not report the expected synthetic canary rule."
            exit 1
          fi
          echo "Gitleaks synthetic canary detection: PASS"
      - name: Scan complete Git history for secrets
        shell: bash
        run: |
          set -euo pipefail
          evidence_dir="${RUNNER_TEMP}/gitleaks-evidence"
          mkdir -p "$evidence_dir"
          gitleaks detect --source "$GITHUB_WORKSPACE" --redact --exit-code=2 --report-format=json --report-path="$evidence_dir/full-history-report.json"
          echo "Gitleaks full-history scan: PASS"
      # Retain redacted scan results as downloadable audit evidence.
      - name: Upload full-history secret scan evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gitleaks-full-history-${{ github.run_id }}
          path: ${{ runner.temp }}/gitleaks-evidence/full-history-report.json
          if-no-files-found: warn
          retention-days: 90

  dependency-audit:
    name: Dependency audit / npm
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify supported Node.js runtime
        shell: bash
        run: |
          set -euo pipefail
          node --version
          npm --version
          node -e "if (Number(process.versions.node.split('.')[0]) < 22) process.exit(1)"
      - name: Install exact locked dependency graph
        run: npm ci --ignore-scripts
      - name: Lint all repository Markdown documentation
        run: npm run lint:markdown
      - name: Audit all direct and transitive dependencies
        shell: bash
        run: |
          set +e
          npm audit --audit-level=high --json > "${RUNNER_TEMP}/npm-audit.json"
          audit_status=$?
          cat "${RUNNER_TEMP}/npm-audit.json"
          if [ "$audit_status" -ne 0 ]; then
            echo "::error::npm audit detected high/critical vulnerabilities or could not complete."
            exit "$audit_status"
          fi
          echo "npm audit: no high or critical vulnerabilities."
      - name: Validate Issue #78 JSON Schema Draft 2020-12
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "${RUNNER_TEMP}/contract-schema-venv"
          "${RUNNER_TEMP}/contract-schema-venv/bin/python" -m pip install --disable-pip-version-check --no-input -r requirements-contract-validation.txt
          "${RUNNER_TEMP}/contract-schema-venv/bin/python" scripts/validation/validate_source_evidence_contract_schema.py
      # Retain dependency audit results for traceability and later review.
      - name: Upload dependency audit evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-dependency-audit-${{ github.run_id }}
          path: ${{ runner.temp }}/npm-audit.json
          if-no-files-found: warn
          retention-days: 90

  # PR scans compare the target and proposed revisions; SARIF upload is tested separately and remains disabled here.
  osv-pr:
    name: OSV dependency scan / PR
    if: github.event_name == 'pull_request'
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@d3c1414ded37de590f207572e37a7d180f1d0ef7 # v2.7.1
    with:
      scan-args: |-
        --include-git-root
        -r
        ./
      upload-sarif: false
      fail-on-vuln: true

  # Full-history scanning is intentionally reserved for push, schedule, and manual runs.
  osv-full:
    name: OSV dependency scan / full
    if: github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@d3c1414ded37de590f207572e37a7d180f1d0ef7 # v2.7.1
    with:
      scan-args: |-
        --include-git-root
        -r
        ./
      upload-sarif: false
      fail-on-vuln: true
