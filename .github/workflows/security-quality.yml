name: Security and dependency quality gate

on:
  pull_request:
    branches:
      - main
    paths:
      - "**"
      - ".github/workflows/security-quality.yml"
      - ".github/dependabot.yml"
  push:
    branches:
      - main
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  secret-scan:
    name: Secret scanning / Gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout full Git history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan repository history for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
          GITLEAKS_ENABLE_SUMMARY: "true"

  dependency-audit:
    name: Dependency audit / npm
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.0
        with:
          persist-credentials: false
      - name: Verify supported Node.js runtime
        shell: bash
        run: |
          set -euo pipefail
          node --version
          npm --version
          node -e "if (Number(process.versions.node.split('.')[0]) < 22) process.exit(1)"
      - name: Install exact locked dependency graph
        run: npm ci --ignore-scripts
      - name: Audit all direct and transitive dependencies
        shell: bash
        run: |
          set +e
          npm audit --audit-level=high --json > "${RUNNER_TEMP}/npm-audit.json"
          audit_status=$?
          cat "${RUNNER_TEMP}/npm-audit.json"
          if [ "$audit_status" -ne 0 ]; then
            echo "::error::npm audit detected high/critical vulnerabilities or could not complete."
            exit "$audit_status"
          fi
          echo "npm audit: no high or critical vulnerabilities."
      - name: Upload dependency audit evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: npm-dependency-audit-${{ github.run_id }}
          path: ${{ runner.temp }}/npm-audit.json
          if-no-files-found: warn
          retention-days: 90

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Review dependency changes
        uses: actions/dependency-review-action@3c4e3dcb1aa7874d2c16be7d79418e9b7efd6261 # v4.8.2
        with:
          fail-on-severity: high
          comment-summary-in-pr: never
